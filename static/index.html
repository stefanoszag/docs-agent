<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>docs-agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --text-muted: #6b7280;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --ai-bg: #f3f4f6;
      --ai-text: #1a1a1a;
      --accent: #2563eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 8px;
      padding-bottom: 80px;
    }

    .empty-state h2 {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text);
    }

    .empty-state p { font-size: 0.875rem; }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 72%;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.ai {
      align-self: flex-start;
      align-items: flex-start;
    }

    .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .message.ai .bubble {
      background: var(--ai-bg);
      color: var(--ai-text);
      border-bottom-left-radius: 4px;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 14px 16px;
      background: var(--ai-bg);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    #question {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
      max-height: 160px;
      outline: none;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.15s;
    }

    #question:focus { border-color: var(--accent); }

    #send {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    #send:hover { opacity: 0.9; }
    #send:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span>
    docs-agent
  </header>

  <div id="chat">
    <div class="empty-state" id="empty">
      <h2>Ask a question</h2>
      <p>Answers are grounded in your project documentation.</p>
    </div>
  </div>

  <div id="input-area">
    <textarea id="question" rows="1" placeholder="Ask about your docs…"></textarea>
    <button id="send">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('question');
    const sendBtn = document.getElementById('send');
    const empty = document.getElementById('empty');

    // persist session across page refreshes
    let sessionId = localStorage.getItem('docs_agent_session');
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem('docs_agent_session', sessionId);
    }

    function appendMessage(role, content) {
      empty.style.display = 'none';

      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = role === 'user' ? 'You' : 'docs-agent';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;

      wrapper.appendChild(label);
      wrapper.appendChild(bubble);
      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      empty.style.display = 'none';

      const wrapper = document.createElement('div');
      wrapper.className = 'message ai';

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = 'docs-agent';

      const dots = document.createElement('div');
      dots.className = 'typing';
      dots.innerHTML = '<span></span><span></span><span></span>';

      wrapper.appendChild(label);
      wrapper.appendChild(dots);
      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;
      return wrapper;
    }

    async function loadHistory() {
      try {
        const res = await fetch(`/sessions/${sessionId}/history`);
        if (!res.ok) return;
        const messages = await res.json();
        messages.forEach(m => appendMessage(m.role === 'human' ? 'user' : 'ai', m.content));
      } catch (_) {}
    }

    async function sendQuestion() {
      const question = input.value.trim();
      if (!question) return;

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      input.disabled = true;

      appendMessage('user', question);
      const typingEl = showTyping();

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, session_id: sessionId }),
        });

        typingEl.remove();

        if (!res.ok) {
          appendMessage('ai', 'Something went wrong. Please try again.');
          return;
        }

        const data = await res.json();
        appendMessage('ai', data.answer);
      } catch (_) {
        typingEl.remove();
        appendMessage('ai', 'Could not reach the server. Is it running?');
      } finally {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    // auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });

    // Enter to send, Shift+Enter for newline
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendQuestion();
      }
    });

    sendBtn.addEventListener('click', sendQuestion);

    loadHistory();
  </script>
</body>
</html>
